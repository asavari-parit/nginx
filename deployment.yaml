apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: 732203471303.dkr.ecr.ap-south-1.amazonaws.com/my-ecr:latest
        ports:
        - containerPort: 80
