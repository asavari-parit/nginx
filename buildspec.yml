version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 732203471303.dkr.ecr.ap-south-1.amazonaws.com
      - REPOSITORY_URI=732203471303.dkr.ecr.ap-south-1.amazonaws.com/demo
      - IMAGE_TAG=latest

  build:
    commands:
      - echo Build Docker image started...
      - docker build -t demo .
      - docker tag demo:latest $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing Docker image...
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Build completed
